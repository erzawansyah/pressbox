<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PressBox">
  <defs>
    <linearGradient id="pb-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#22d3a6"/>
      <stop offset="1" stop-color="#d9f99d"/>
