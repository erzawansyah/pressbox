name: pressbox

services:
  # Production WordPress managed by PressBox (the demo site: Senja Coffee).
  live:
    build: ./wp
    image: pressbox-wp:latest
    container_name: pressbox-live
    environment:
      PB_ROLE: live
      PB_HOME: ${LIVE_PUBLIC_URL:-http://localhost:8080}
      PB_CONTROL_URL: ${PUBLIC_URL:-http://localhost:8300}/app
      LIVE_ADMIN_PASSWORD: ${LIVE_ADMIN_PASSWORD:?Set LIVE_ADMIN_PASSWORD in .env}
    ports:
      - "8080:8080"
    volumes:
      - live_wp_content:/srv/wordpress/wp-content
    restart: unless-stopped

  # Control plane: chat UI, agent loop (LLM via Vultr Serverless Inference), sandbox orchestration, gate.
  # It talks to the Docker daemon to create/destroy sandboxes; it never runs agent-written code itself.
  control:
    build: ./control
    container_name: pressbox-control
    env_file:
      - path: .env
        required: false
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8300}
      PREVIEW_PUBLIC_URL: ${PREVIEW_PUBLIC_URL:-http://localhost:8301}
      LIVE_PUBLIC_URL: ${LIVE_PUBLIC_URL:-http://localhost:8080}
      LIVE_CONTAINER: pressbox-live
      SANDBOX_IMAGE: pressbox-wp:latest
      SANDBOX_NETWORK: pb_sandbox
      # The Vultr account key in .env is for provisioning scripts only; the control plane never gets it.
      VULTR_API_KEY: ""
    ports:
      - "${APP_PORT:-8300}:3000"
      - "${PREVIEW_PORT:-8301}:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - pb_sandbox
    depends_on:
      - live
    restart: unless-stopped

networks:
  # Sandboxes live only here. internal: no gateway, so no internet and no cloud metadata endpoint.
  # The live site is NOT attached to this network.
  pb_sandbox:
    name: pb_sandbox
    internal: true

volumes:
  live_wp_content:
